<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="560" viewBox="0 0 1700 560" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>.t{font-size:17px;font-weight:700;fill:#0f172a}.s{font-size:13.5px;fill:#334155}.n{font-size:22px;font-weight:700;fill:#ffffff}.r{font-size:13px;font-weight:700}</style>
  </defs>
  <rect width="1700" height="560" fill="#ffffff"/>
  <text x="40" y="46" style="font-size:26px;font-weight:700;fill:#0f172a">The journey of a push</text>
  <text x="40" y="74" class="s">git push  →  checks first (can refuse)  →  the branches move  →  extra work after (can never break the push)</text>
  <rect x="30" y="100" width="1000" height="44" rx="8" fill="#ecfdf5" stroke="#15803d"/>
  <text x="48" y="128" class="r" fill="#166534">BEFORE anything changes: each step can stop the push with a clear message</text>
  <rect x="1060" y="100" width="610" height="44" rx="8" fill="#fff7ed" stroke="#c2410c"/>
  <text x="1078" y="128" class="r" fill="#9a3412">AFTER the push succeeded: only warnings, never a failure</text>
  <!-- step boxes -->
  <g>
    <rect x="30" y="170" width="230" height="300" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <circle cx="62" cy="204" r="20" fill="#15803d"/><text x="55" y="212" class="n">1</text>
    <text x="92" y="210" class="t">OpenSSH</text>
    <text x="48" y="250" class="s">Is this key on the</text><text x="48" y="270" class="s">server's list?</text>
    <text x="48" y="300" class="s">Is it coming from an</text><text x="48" y="320" class="s">allowed network?</text>
    <text x="48" y="360" class="s">Then run the gate.</text><text x="48" y="380" class="s">(Never a shell.)</text>
    <text x="48" y="430" class="r" fill="#b91c1c">✘ Permission denied</text><text x="48" y="450" class="r" fill="#b91c1c">   (publickey)</text>
  </g>
  <g>
    <rect x="285" y="170" width="230" height="300" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <circle cx="317" cy="204" r="20" fill="#15803d"/><text x="310" y="212" class="n">2</text>
    <text x="347" y="210" class="t">Gate</text>
    <text x="303" y="250" class="s">Which key logged in?</text><text x="303" y="270" class="s">→ this is alice</text>
    <text x="303" y="300" class="s">What does she want?</text><text x="303" y="320" class="s">→ push to fpga-rtl</text>
    <text x="303" y="350" class="s">Permission table:</text><text x="303" y="370" class="s">alice = write ✔</text>
    <text x="303" y="430" class="r" fill="#b91c1c">✘ read-only access /</text><text x="303" y="450" class="r" fill="#b91c1c">   no access</text>
  </g>
  <g>
    <rect x="540" y="170" width="230" height="300" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <circle cx="572" cy="204" r="20" fill="#15803d"/><text x="565" y="212" class="n">3</text>
    <text x="602" y="210" class="t">Rules check</text>
    <text x="558" y="250" class="s">Builds on the latest</text><text x="558" y="270" class="s">version? (no force)</text>
    <text x="558" y="300" class="s">Deleting main or a tag?</text>
    <text x="558" y="330" class="s">Deleting someone</text><text x="558" y="350" class="s">else's branch?</text>
    <text x="558" y="375" class="s">(pre-receive hook)</text>
    <text x="558" y="430" class="r" fill="#b91c1c">✘ rejected (fetch first)</text><text x="558" y="450" class="r" fill="#b91c1c">✘ cannot be deleted</text>
  </g>
  <g>
    <rect x="795" y="170" width="235" height="300" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <circle cx="827" cy="204" r="20" fill="#2563eb"/><text x="820" y="212" class="n">4</text>
    <text x="857" y="210" class="t">Branches move</text>
    <text x="813" y="250" class="s">Git stores the new</text><text x="813" y="270" class="s">commits and moves</text><text x="813" y="290" class="s">main (or the branch)</text>
    <text x="813" y="330" class="s">From now on, everyone</text><text x="813" y="350" class="s">who pulls gets them.</text>
    <text x="813" y="440" class="r" fill="#1d4ed8">✔ push accepted</text>
  </g>
  <g>
    <rect x="1060" y="170" width="290" height="300" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <circle cx="1092" cy="204" r="20" fill="#c2410c"/><text x="1085" y="212" class="n">5</text>
    <text x="1122" y="210" class="t">Record &amp; back up</text>
    <text x="1078" y="250" class="s">New branch? Record its</text><text x="1078" y="270" class="s">creator (for deletion rules)</text>
    <text x="1078" y="305" class="s">main changed? Copy main to</text><text x="1078" y="325" class="s">the hidden backup and add a</text><text x="1078" y="345" class="s">timestamped snapshot</text>
    <text x="1078" y="370" class="s">(post-receive hook)</text>
    <text x="1078" y="430" class="r" fill="#9a3412">⚠ problem → warning only,</text><text x="1078" y="450" class="r" fill="#9a3412">   your push is safe</text>
  </g>
  <g>
    <rect x="1375" y="170" width="295" height="300" rx="12" fill="#fffbeb" stroke="#c2410c" stroke-width="2" stroke-dasharray="8 5"/>
    <circle cx="1407" cy="204" r="20" fill="#c2410c"/><text x="1400" y="212" class="n">6</text>
    <text x="1437" y="210" class="t">NAS copy (optional)</text>
    <text x="1393" y="250" class="s">Started in the background,</text><text x="1393" y="270" class="s">fully detached</text>
    <text x="1393" y="305" class="s">One copy per project at a</text><text x="1393" y="325" class="s">time, 10-minute limit</text>
    <text x="1393" y="360" class="s">Your push has already</text><text x="1393" y="380" class="s">finished: nothing waits</text>
    <text x="1393" y="440" class="r" fill="#9a3412">NAS off → just logged</text>
  </g>
  <path d="M260,320 L281,320" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M515,320 L536,320" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M770,320 L791,320" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M1030,320 L1056,320" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M1350,320 L1371,320" stroke="#475569" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="40" y="515" class="s">Rule of thumb: safety checks happen before the write (they may refuse); extra work happens after the write (it can never undo or delay your push).</text>
</svg>
