# Include in nginx's http context (Ubuntu: /etc/nginx/sites-available/privategit).
# Replace git.internal and certificate paths. Certificates must be trusted by clients.
limit_req_zone $binary_remote_addr zone=privategit_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=privategit_login:10m rate=5r/m;

server {
    listen 80;
    server_name git.internal;
    if ($host != git.internal) { return 444; }
    return 301 https://git.internal$request_uri;
}
server {
    listen 443 ssl;
    server_name git.internal;
    if ($host != git.internal) { return 444; }
    ssl_certificate /etc/privategit/tls/fullchain.pem;
    ssl_certificate_key /etc/privategit/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 20s;

    # Replace with your approved network(s), including your administrator's address.
    # Enforce the same policy on HTTP port 80 and SSH through the host/network firewall.
    allow 192.168.1.0/24;
    deny all;

    location = /Login {
        limit_req zone=privategit_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host git.internal;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_read_timeout 20s;
    }
    # The two stylesheets: no rate limit (they load with every page).
    location ~ ^/(site|history)\.css$ {
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host git.internal;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_read_timeout 20s;
    }
    location / {
        limit_req zone=privategit_general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host git.internal;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_read_timeout 20s;
    }
}
