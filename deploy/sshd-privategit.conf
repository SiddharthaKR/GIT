# /etc/ssh/sshd_config.d/60-privategit.conf
# Reference only: install.sh renders this file with your networks (AllowUsers).
# Keep administrator access in a separate account.
Match User git
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/privategit/authorized_keys
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
    X11Forwarding no
    ExposeAuthInfo yes
    ForceCommand /opt/privategit/PrivateGit git-serve --config /etc/privategit/environment
    AcceptEnv GIT_PROTOCOL
Match all
